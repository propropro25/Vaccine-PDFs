<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF Library</title>

<style>
:root {
  color-scheme:dark;
  --bg:#0b0b0b;
  --card:#121418;
  --card2:#0f1115;
  --muted:#9aa0a6;
  --ink:#e8eaed;
  --brand:#377dff;
  --brand2:#5a96ff;
  --line:#1b2232;
}

* {
  box-sizing:border-box;
}

html {
  scroll-behavior:smooth;
}

body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Inter,"Helvetica Neue",Arial,sans-serif;
}

body.modal-open {
  overflow:hidden;
}

a,
button,
input,
select {
  font:inherit;
}

a {
  color:inherit;
}

#w {
  max-width:1200px;
  margin:28px auto;
  padding:0 18px;
}

.topbar {
  display:flex;
  gap:12px;
  align-items:center;
  flex-wrap:wrap;
  margin-bottom:21px;
}

.title {
  display:flex;
  gap:10px;
  align-items:center;
  margin-right:auto;
  font-size:22px;
  font-weight:700;
}

.count {
  padding:3px 7px;
  border:1px solid #1c2435;
  border-radius:999px;
  background:#10131a;
  color:var(--muted);
  font:12px/1 ui-monospace,Consolas,monospace;
}

.search {
  position:relative;
  flex:1;
  min-width:240px;
}

.search input {
  width:100%;
  padding:11px 12px 11px 36px;
  border:1px solid #182032;
  border-radius:12px;
  outline:none;
  background:#0e1219;
  color:var(--ink);
}

.search input:focus {
  border-color:#476da8;
  box-shadow:0 0 0 3px rgba(55,125,255,.16);
}

.search svg {
  position:absolute;
  top:50%;
  left:11px;
  transform:translateY(-50%);
  opacity:.6;
}

.sort select {
  padding:10px 12px;
  border:1px solid #182032;
  border-radius:12px;
  background:#0e1219;
  color:var(--ink);
}

.grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:16px;
}

.card {
  margin:0;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:14px;
  background:linear-gradient(180deg,var(--card),var(--card2));
  box-shadow:0 10px 24px rgba(0,0,0,.25);
  transition:
    transform .18s ease,
    border-color .18s ease;
}

.card:hover {
  transform:translateY(-3px);
  border-color:#2d3b59;
}

.thumb-wrap {
  position:relative;
  aspect-ratio:3/4;
  overflow:hidden;
  background:#0a0d14;
  cursor:zoom-in;
}

.thumb-wrap:focus-visible {
  outline:3px solid var(--brand);
  outline-offset:-3px;
}

.thumb {
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  transition:
    transform .25s ease,
    opacity .25s ease;
}

.thumb-wrap:hover .thumb {
  transform:scale(1.018);
  opacity:.92;
}

.skeleton {
  background:
    linear-gradient(
      90deg,
      #0d1118 0%,
      #121722 40%,
      #0d1118 80%
    );
  background-size:200% 100%;
  animation:shimmer 1.1s infinite;
}

@keyframes shimmer {
  to {
    background-position:-200% 0;
  }
}

.preview-hint {
  position:absolute;
  top:12px;
  right:12px;
  display:grid;
  width:34px;
  height:34px;
  place-items:center;
  border:1px solid rgba(255,255,255,.18);
  border-radius:50%;
  background:rgba(0,0,0,.72);
  color:#fff;
  opacity:0;
  transition:opacity .18s ease;
  pointer-events:none;
}

.thumb-wrap:hover .preview-hint,
.thumb-wrap:focus .preview-hint {
  opacity:1;
}

.badge {
  position:absolute;
  bottom:12px;
  left:12px;
  padding:7px 12px;
  border:1px solid #2d65d2;
  border-radius:999px;
  background:var(--brand);
  color:#fff;
  font-size:12px;
  font-weight:600;
  text-decoration:none;
  box-shadow:0 6px 18px rgba(21,79,255,.35);
}

.badge:hover {
  background:var(--brand2);
}

.meta {
  overflow:hidden;
  padding:10px 12px;
  border-top:1px solid #161d2b;
  color:#cfd5df;
  font-size:12px;
  text-overflow:ellipsis;
  white-space:nowrap;
}

#status {
  margin-top:13px;
  color:var(--muted);
  font:12px ui-monospace,Consolas,monospace;
}

/* Shadowbox */

.shadowbox {
  position:fixed;
  inset:0;
  z-index:1000;
  display:none;
  background:rgba(0,0,0,.93);
  color:#fff;
  touch-action:pan-y pinch-zoom;
}

.shadowbox.open {
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;
}

.shadowbox-header {
  position:relative;
  z-index:5;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  min-height:64px;
  padding:11px 17px;
  border-bottom:1px solid #252525;
  background:rgba(10,10,10,.9);
  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
}

.shadowbox-heading {
  min-width:0;
}

.shadowbox-count {
  margin-bottom:3px;
  color:#8e8e93;
  font-size:11px;
  font-weight:700;
  letter-spacing:.1em;
  text-transform:uppercase;
}

.shadowbox-title {
  overflow:hidden;
  max-width:70vw;
  color:#eee;
  font-size:14px;
  font-weight:650;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.close-button {
  flex:0 0 auto;
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:#252525;
  color:#fff;
  font-size:25px;
  line-height:1;
  cursor:pointer;
}

.shadowbox-stage {
  position:relative;
  min-height:0;
  display:grid;
  place-items:center;
  overflow:hidden;
  padding:18px 80px;
  user-select:none;
}

.full-preview {
  display:block;
  max-width:100%;
  max-height:100%;
  object-fit:contain;
  border-radius:4px;
  background:#fff;
  box-shadow:0 18px 70px rgba(0,0,0,.55);
  cursor:pointer;
}

.full-preview.loading-preview {
  width:min(620px,70vw);
  aspect-ratio:3/4;
  object-fit:contain;
  background:
    linear-gradient(
      90deg,
      #121212 0%,
      #202020 40%,
      #121212 80%
    );
  background-size:200% 100%;
  animation:shimmer 1.1s infinite;
}

.preview-error {
  max-width:440px;
  padding:25px;
  color:#aaa;
  text-align:center;
}

.nav-button {
  position:absolute;
  top:50%;
  z-index:4;
  width:52px;
  height:52px;
  display:grid;
  place-items:center;
  transform:translateY(-50%);
  border:1px solid #393939;
  border-radius:50%;
  background:rgba(25,25,25,.88);
  color:#fff;
  font-size:31px;
  cursor:pointer;
}

.nav-button:hover {
  background:#fff;
  color:#000;
}

.nav-button.previous {
  left:17px;
}

.nav-button.next {
  right:17px;
}

.shadowbox-footer {
  position:relative;
  z-index:5;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  min-height:68px;
  padding:11px 17px;
  border-top:1px solid #252525;
  background:rgba(10,10,10,.9);
  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
}

.instructions {
  color:#8e8e93;
  font-size:12px;
}

.open-full {
  flex:0 0 auto;
  padding:12px 17px;
  border-radius:999px;
  background:#fff;
  color:#000;
  font-size:13px;
  font-weight:750;
  text-decoration:none;
}

.close-button:focus-visible,
.nav-button:focus-visible,
.open-full:focus-visible {
  outline:3px solid var(--brand);
  outline-offset:3px;
}

@media (max-width:650px) {
  #w {
    margin-top:19px;
    padding:0 14px;
  }

  .title {
    width:100%;
  }

  .search {
    min-width:0;
  }

  .sort {
    width:100%;
  }

  .sort select {
    width:100%;
  }

  .grid {
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:11px;
  }

  .meta {
    padding:9px;
  }

  .shadowbox-stage {
    padding:10px 4px 70px;
  }

  .shadowbox-title {
    max-width:72vw;
  }

  .nav-button {
    top:auto;
    bottom:9px;
    width:47px;
    height:47px;
    transform:none;
  }

  .nav-button.previous {
    left:calc(50% - 57px);
  }

  .nav-button.next {
    right:calc(50% - 57px);
  }

  .shadowbox-footer {
    min-height:62px;
  }

  .instructions {
    display:none;
  }

  .open-full {
    width:100%;
    text-align:center;
  }
}

@media (max-width:410px) {
  .grid {
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div id="w">

  <div class="topbar">

    <div class="title">
      PDF Library
      <span id="count" class="count">0</span>
    </div>

    <label class="search" aria-label="Search PDFs">
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <path
          d="M21 21l-4.1-4.1M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z"
          stroke="#9aa0a6"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>

      <input
        id="q"
        type="search"
        placeholder="Search files…"
      >
    </label>

    <div class="sort">
      <select id="sort" aria-label="Sort PDF files">
        <option value="az" selected>Name A → Z</option>
        <option value="za">Name Z → A</option>
      </select>
    </div>

  </div>

  <div id="grid" class="grid"></div>
  <div id="status">Loading…</div>

</div>

<div
  class="shadowbox"
  id="shadowbox"
  role="dialog"
  aria-modal="true"
  aria-label="PDF first-page preview"
  aria-hidden="true"
>

  <header class="shadowbox-header">
    <div class="shadowbox-heading">
      <div
        class="shadowbox-count"
        id="shadowboxCount"
      ></div>

      <div
        class="shadowbox-title"
        id="shadowboxTitle"
      ></div>
    </div>

    <button
      class="close-button"
      id="closeButton"
      type="button"
      aria-label="Close preview"
    >
      ×
    </button>
  </header>

  <div
    class="shadowbox-stage"
    id="shadowboxStage"
  >
    <button
      class="nav-button previous"
      id="previousButton"
      type="button"
      aria-label="Previous PDF"
    >
      ‹
    </button>

    <img
      class="full-preview"
      id="fullPreview"
      alt=""
      draggable="false"
    >

    <div
      class="preview-error"
      id="previewError"
      hidden
    >
      This first-page preview could not be rendered.
      You can still open the complete PDF below.
    </div>

    <button
      class="nav-button next"
      id="nextButton"
      type="button"
      aria-label="Next PDF"
    >
      ›
    </button>
  </div>

  <footer class="shadowbox-footer">
    <div class="instructions">
      Swipe, click either side, or use ← and → to browse
    </div>

    <a
      class="open-full"
      id="openFull"
      href="#"
      target="_blank"
      rel="noopener"
    >
      Open complete PDF ↗
    </a>
  </footer>

</div>

<script
  src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"
></script>

<script>
const MAKE_THUMBS = true;
const THUMB_SCALE = 0.60;
const SHADOWBOX_SCALE = 1.55;

const MANIFEST_URL =
  "./pdfs.json?v=" + Date.now();

const $ =
  selector => document.querySelector(selector);

const status =
  text => {
    $("#status").textContent = text || "";
  };

let ALL = [];
let VIEW = [];
let observer = null;

let activeIndex = 0;
let previousFocus = null;
let previewRequest = 0;

let touchStartX = 0;
let touchStartY = 0;

const thumbnailCache =
  new Map();

const shadowbox =
  $("#shadowbox");

const fullPreview =
  $("#fullPreview");

const previewError =
  $("#previewError");

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";

function applyFilterSort() {
  const query =
    $("#q").value
      .trim()
      .toLowerCase();

  const mode =
    $("#sort").value;

  VIEW =
    !query
      ? [...ALL]
      : ALL.filter(item =>
          item.name
            .toLowerCase()
            .includes(query)
        );

  VIEW.sort((a,b) =>
    a.name.localeCompare(
      b.name,
      undefined,
      {
        numeric:true,
        sensitivity:"base"
      }
    )
  );

  if (mode === "za") {
    VIEW.reverse();
  }

  $("#count").textContent =
    VIEW.length;

  renderGrid();
}

function renderGrid() {
  const grid = $("#grid");

  grid.replaceChildren();

  if (observer) {
    observer.disconnect();
    observer = null;
  }

  VIEW.forEach((item,index) => {
    const card =
      document.createElement("figure");

    card.className = "card";

    const wrap =
      document.createElement("div");

    wrap.className = "thumb-wrap";
    wrap.tabIndex = 0;
    wrap.setAttribute(
      "role",
      "button"
    );

    wrap.setAttribute(
      "aria-label",
      "Preview first page of " + item.name
    );

    const image =
      document.createElement("img");

    image.className = "thumb skeleton";
    image.alt = "";
    image.decoding = "async";
    image.loading = "lazy";
    image.dataset.pdf = item.href;

    if (thumbnailCache.has(item.href)) {
      image.src =
        thumbnailCache.get(item.href);

      image.classList.remove("skeleton");
    }

    const hint =
      document.createElement("span");

    hint.className = "preview-hint";
    hint.textContent = "↗";
    hint.setAttribute(
      "aria-hidden",
      "true"
    );

    const open =
      document.createElement("a");

    open.href = item.href;
    open.target = "_blank";
    open.rel = "noopener";
    open.className = "badge";
    open.textContent = "Open PDF";

    /*
      Stop the full-PDF button from also opening
      the first-page shadowbox.
    */
    open.addEventListener(
      "click",
      event => {
        event.stopPropagation();
      }
    );

    wrap.addEventListener(
      "click",
      event => {
        if (event.target.closest(".badge")) {
          return;
        }

        openShadowbox(index);
      }
    );

    wrap.addEventListener(
      "keydown",
      event => {
        if (
          event.key === "Enter" ||
          event.key === " "
        ) {
          event.preventDefault();
          openShadowbox(index);
        }
      }
    );

    wrap.append(
      image,
      hint,
      open
    );

    const meta =
      document.createElement("figcaption");

    meta.className = "meta";
    meta.title = item.name;
    meta.textContent = item.name;

    card.append(wrap,meta);
    grid.appendChild(card);
  });

  if (MAKE_THUMBS) {
    initializeThumbnails();
  }

  status(
    "Ready. " +
    VIEW.length +
    " PDF" +
    (VIEW.length === 1 ? "" : "s") +
    "."
  );
}

async function renderPDFPage(
  url,
  scale,
  quality = 0.88
) {
  const pdf =
    await pdfjsLib
      .getDocument({
        url:url,
        withCredentials:false
      })
      .promise;

  const page =
    await pdf.getPage(1);

  const viewport =
    page.getViewport({
      scale:scale
    });

  const ratio =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  const canvas =
    document.createElement("canvas");

  canvas.width =
    Math.floor(viewport.width * ratio);

  canvas.height =
    Math.floor(viewport.height * ratio);

  const context =
    canvas.getContext(
      "2d",
      {
        alpha:false,
        willReadFrequently:false
      }
    );

  context.setTransform(
    ratio,
    0,
    0,
    ratio,
    0,
    0
  );

  await page.render({
    canvasContext:context,
    viewport:viewport,
    intent:"display"
  }).promise;

  return canvas.toDataURL(
    "image/jpeg",
    quality
  );
}

function initializeThumbnails() {
  if (!window.pdfjsLib) {
    status(
      "PDF.js is unavailable; showing placeholders."
    );

    return;
  }

  observer =
    new IntersectionObserver(
      async entries => {
        for (const entry of entries) {
          if (!entry.isIntersecting) {
            continue;
          }

          const image =
            entry.target;

          observer.unobserve(image);

          const url =
            image.dataset.pdf;

          if (thumbnailCache.has(url)) {
            image.src =
              thumbnailCache.get(url);

            image.classList.remove(
              "skeleton"
            );

            continue;
          }

          try {
            const dataURL =
              await renderPDFPage(
                url,
                THUMB_SCALE,
                0.84
              );

            thumbnailCache.set(
              url,
              dataURL
            );

            /*
              The grid may have been rebuilt while
              the PDF was rendering.
            */
            if (image.isConnected) {
              image.src = dataURL;

              image.classList.remove(
                "skeleton"
              );
            }
          } catch (error) {
            image.alt =
              "Preview unavailable";

            image.classList.remove(
              "skeleton"
            );
          }
        }
      },
      {
        rootMargin:"300px 0px 300px 0px",
        threshold:.01
      }
    );

  document
    .querySelectorAll(".thumb")
    .forEach(image => {
      if (
        image.src &&
        !image.classList.contains("skeleton")
      ) {
        return;
      }

      observer.observe(image);
    });
}

function openShadowbox(index) {
  if (!VIEW.length) {
    return;
  }

  activeIndex =
    Math.max(
      0,
      Math.min(index,VIEW.length - 1)
    );

  previousFocus =
    document.activeElement;

  shadowbox.classList.add("open");
  shadowbox.setAttribute(
    "aria-hidden",
    "false"
  );

  document.body.classList.add(
    "modal-open"
  );

  showShadowboxItem();
  $("#closeButton").focus();
}

function closeShadowbox() {
  previewRequest++;

  shadowbox.classList.remove("open");
  shadowbox.setAttribute(
    "aria-hidden",
    "true"
  );

  document.body.classList.remove(
    "modal-open"
  );

  fullPreview.removeAttribute("src");
  previewError.hidden = true;

  if (previousFocus) {
    previousFocus.focus();
  }
}

async function showShadowboxItem() {
  const item =
    VIEW[activeIndex];

  if (!item) {
    return;
  }

  const request =
    ++previewRequest;

  $("#shadowboxCount").textContent =
    (activeIndex + 1) +
    " of " +
    VIEW.length;

  $("#shadowboxTitle").textContent =
    item.name;

  $("#openFull").href =
    item.href;

  fullPreview.alt =
    "First page of " + item.name;

  previewError.hidden = true;
  fullPreview.hidden = false;
  fullPreview.classList.add(
    "loading-preview"
  );

  /*
    Display the existing grid thumbnail immediately
    while the sharper shadowbox preview renders.
  */
  if (thumbnailCache.has(item.href)) {
    fullPreview.src =
      thumbnailCache.get(item.href);
  } else {
    fullPreview.removeAttribute("src");
  }

  try {
    const dataURL =
      await renderPDFPage(
        item.href,
        SHADOWBOX_SCALE,
        0.94
      );

    /*
      Ignore a completed render if the visitor
      already moved to another item.
    */
    if (
      request !== previewRequest ||
      !shadowbox.classList.contains("open")
    ) {
      return;
    }

    fullPreview.src = dataURL;

    fullPreview.classList.remove(
      "loading-preview"
    );
  } catch (error) {
    if (request !== previewRequest) {
      return;
    }

    fullPreview.hidden = true;
    fullPreview.classList.remove(
      "loading-preview"
    );

    previewError.hidden = false;
  }
}

function moveShadowbox(direction) {
  if (!VIEW.length) {
    return;
  }

  activeIndex =
    (
      activeIndex +
      direction +
      VIEW.length
    ) % VIEW.length;

  showShadowboxItem();
}

$("#previousButton").addEventListener(
  "click",
  () => moveShadowbox(-1)
);

$("#nextButton").addEventListener(
  "click",
  () => moveShadowbox(1)
);

$("#closeButton").addEventListener(
  "click",
  closeShadowbox
);

/*
  Clicking the left half of the page goes backward.
  Clicking the right half goes forward.
*/
fullPreview.addEventListener(
  "click",
  event => {
    const bounds =
      fullPreview.getBoundingClientRect();

    const position =
      event.clientX - bounds.left;

    moveShadowbox(
      position < bounds.width / 2
        ? -1
        : 1
    );
  }
);

shadowbox.addEventListener(
  "click",
  event => {
    if (event.target === shadowbox) {
      closeShadowbox();
    }
  }
);

document.addEventListener(
  "keydown",
  event => {
    if (
      !shadowbox.classList.contains("open")
    ) {
      return;
    }

    if (event.key === "Escape") {
      closeShadowbox();
    }

    if (event.key === "ArrowLeft") {
      event.preventDefault();
      moveShadowbox(-1);
    }

    if (event.key === "ArrowRight") {
      event.preventDefault();
      moveShadowbox(1);
    }
  }
);

$("#shadowboxStage").addEventListener(
  "touchstart",
  event => {
    if (!event.touches.length) {
      return;
    }

    touchStartX =
      event.touches[0].clientX;

    touchStartY =
      event.touches[0].clientY;
  },
  {
    passive:true
  }
);

$("#shadowboxStage").addEventListener(
  "touchend",
  event => {
    if (!event.changedTouches.length) {
      return;
    }

    const endX =
      event.changedTouches[0].clientX;

    const endY =
      event.changedTouches[0].clientY;

    const differenceX =
      endX - touchStartX;

    const differenceY =
      endY - touchStartY;

    /*
      Ignore short gestures and primarily
      vertical scrolling gestures.
    */
    if (
      Math.abs(differenceX) < 45 ||
      Math.abs(differenceX) <
        Math.abs(differenceY)
    ) {
      return;
    }

    moveShadowbox(
      differenceX < 0
        ? 1
        : -1
    );
  },
  {
    passive:true
  }
);

window.addEventListener(
  "DOMContentLoaded",
  async () => {
    try {
      status("Loading manifest…");

      const response =
        await fetch(
          MANIFEST_URL,
          {
            cache:"no-store"
          }
        );

      if (!response.ok) {
        throw new Error(
          "Cannot load pdfs.json (" +
          response.status +
          ")."
        );
      }

      const items =
        await response.json();

      ALL =
        (items || [])
          .filter(item =>
            item &&
            item.href
          )
          .map(item => ({
            name:
              item.name ||
              decodeURIComponent(
                item.href
                  .split("/")
                  .pop()
                  .split("?")[0]
              ),
            href:item.href
          }));

      if (!ALL.length) {
        status("No PDFs found.");
        return;
      }

      $("#q").addEventListener(
        "input",
        applyFilterSort
      );

      $("#sort").addEventListener(
        "change",
        applyFilterSort
      );

      applyFilterSort();

    } catch (error) {
      console.error(error);

      status(
        "Error: " +
        (
          error &&
          error.message
            ? error.message
            : error
        )
      );
    }
  }
);
</script>

</body>
</html>
