<script>
(()=>{

const S = t => document.getElementById('status').textContent = t || '';
const byId = id => document.getElementById(id);

const MANIFEST_URL = './pdfs.json?v=' + Date.now();
const MAKE_THUMBS  = true;      // keep previews
const THUMB_SCALE  = 0.45;      // preview size

let allItems=[], filteredItems=[];
const selected = new Set();
let selectMode = false;

window.addEventListener('load', ()=>{
  if (window.pdfjsLib){
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.js';
  }
});

async function loadManifest(){
  const r = await fetch(MANIFEST_URL, {cache:'no-store'});
  if(!r.ok) throw new Error('Cannot load pdfs.json ('+r.status+').');
  allItems = (await r.json()).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
  filteredItems = allItems.slice();
  byId('count').textContent = `(${allItems.length})`;
}

function renderGrid(items, query=''){
  const grid = byId('grid'); grid.innerHTML = '';
  items.forEach(it=>{
    const card = document.createElement('div');
    card.className='card'; card.tabIndex=0;

    const img = document.createElement('img');
    img.className='thumb'; img.alt=`Preview ${it.name}`; img.loading='lazy';
    card.appendChild(img);

    const open = document.createElement('button');
    open.className='open'; open.textContent='Open PDF';
    open.addEventListener('click', e=>{ e.stopPropagation(); window.open(it.href,'_blank'); });
    card.appendChild(open);

    const cb = document.createElement('input'); cb.type='checkbox'; cb.className='pick';
    cb.checked = selected.has(it.href);
    cb.addEventListener('change', ()=>{ cb.checked?selected.add(it.href):selected.delete(it.href); updateSelUI(); });
    card.appendChild(cb);

    const badge = document.createElement('span'); badge.className='badge'; badge.textContent='Selected'; card.appendChild(badge);

    const label = document.createElement('div'); label.className='label'; label.title=it.name;
    label.innerHTML = query ? highlight(it.name, query) : it.name;
    card.appendChild(label);

    const meta = document.createElement('div'); meta.className='meta'; meta.textContent='';
    card.appendChild(meta);
    headSize(it.href, label);

    // keyboard: Enter OR Space opens (Space acts like “expand”)
    card.addEventListener('keydown', e=>{
      if(e.key==='Enter' || e.code==='Enter' || e.key===' ' || e.code==='Space'){
        if (e.target.tagName==='INPUT') return; // let checkbox toggle with Space
        e.preventDefault(); window.open(it.href,'_blank');
      }
    });

    // clicking card (not checkbox) opens
    card.addEventListener('click', e=>{ if(e.target!==cb){ window.open(it.href,'_blank'); } });

    grid.appendChild(card);

    if (MAKE_THUMBS) observeThumb(img, it.href);
  });

  document.body.classList.toggle('select-mode', selectMode);
  updateSelUI();
}

function highlight(txt,q){ const esc=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); return txt.replace(new RegExp(esc,'ig'), m=>`<mark>${m}</mark>`); }

async function headSize(href, el){
  try{ const r=await fetch(href,{method:'HEAD'}); const len=r.headers.get('content-length');
       if(len) el.title=`${el.title||href}  •  ${(Number(len)/1048576).toFixed(2)} MB`; }catch{}
}

function observeThumb(img, url){
  const io = new IntersectionObserver(async entries=>{
    for (const e of entries){
      if(!e.isIntersecting) continue;
      io.unobserve(img);
      try{
        const pdf = await pdfjsLib.getDocument({url,withCredentials:false}).promise;
        const page = await pdf.getPage(1);
        const vp = page.getViewport({scale:THUMB_SCALE});
        const c = document.createElement('canvas'); c.width=vp.width; c.height=vp.height;
        await page.render({canvasContext:c.getContext('2d'), viewport:vp}).promise;
        img.src = c.toDataURL('image/jpeg', .8);
      }catch{ img.alt='Preview unavailable'; }
    }
  }, {rootMargin:'200px'});
  io.observe(img);
}

// selection UI
function updateSelUI(){
  const any = selected.size>0, have = filteredItems.length>0;
  byId('selAll').disabled = !selectMode || !have;
  byId('selNone').disabled = !selectMode || !any;
  byId('dlZip').disabled = !any;
  byId('dlZip').textContent = any ? `Download selected (.zip) – ${selected.size}` : 'Download selected (.zip)';
}
byId('toggleSel').addEventListener('click', ()=>{
  selectMode=!selectMode; document.body.classList.toggle('select-mode', selectMode);
  byId('toggleSel').textContent = selectMode ? 'Done selecting' : 'Select files';
  updateSelUI();
});
byId('selAll').addEventListener('click', ()=>{ filteredItems.forEach(it=>selected.add(it.href));
  document.querySelectorAll('.pick').forEach(cb=>cb.checked=true); updateSelUI(); });
byId('selNone').addEventListener('click', ()=>{ selected.clear();
  document.querySelectorAll('.pick').forEach(cb=>cb.checked=false); updateSelUI(); });
byId('dlZip').addEventListener('click', downloadZip);

async function downloadZip(){
  if(!selected.size) return;
  const files=[...selected], zip=new JSZip();
  S(`Collecting ${files.length} file(s)…`);
  for(let i=0;i<files.length;i++){
    const href=files[i]; S(`Fetching ${i+1}/${files.length}: ${href.split('/').pop()}`);
    const res=await fetch(href); const blob=await res.blob(); zip.file(href.split('/').pop(), blob);
  }
  S('Zipping…'); const out=await zip.generateAsync({type:'blob'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(out);
  a.download=`pdfs-selected-${files.length}.zip`; a.click(); URL.revokeObjectURL(a.href); S('Ready.');
}

// search
byId('q').addEventListener('input', (e)=>{
  const q=e.target.value.trim();
  filteredItems = q ? allItems.filter(it=>it.name.toLowerCase().includes(q.toLowerCase())) : allItems.slice();
  renderGrid(filteredItems, q);
});

// boot
(async function init(){
  try{ S('Loading…'); await loadManifest(); renderGrid(allItems); S('Ready.'); }
  catch(err){ console.error(err); S('Error: '+(err?.message||err)); }
})();
})();
</script>
</body>
</html>
