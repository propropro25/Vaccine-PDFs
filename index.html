<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>PDF Library</title>

  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;background:#0b0b0b;color:#f0f0f0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    #w{max-width:1100px;margin:28px auto;padding:0 16px}
    h1{margin:0 0 12px;font-size:20px}
    #count{opacity:.7;margin-left:.35rem}
    .searchwrap{margin:6px 0 16px}
    input[type="search"]{width:100%;max-width:420px;background:#0e0e10;border:1px solid #202124;border-radius:999px;color:#fff;padding:10px 14px;outline:none}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
    .card{background:#111;border:1px solid #1b1f26;border-radius:10px;overflow:hidden;box-shadow:0 8px 18px rgba(0,0,0,.12)}
    .thumb{width:100%;height:280px;object-fit:cover;background:#000;display:block}
    .meta{padding:8px 10px;font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #status{opacity:.9;margin-top:10px;white-space:pre-wrap;font-family:ui-monospace,Consolas,monospace}
  </style>

  <!-- PDF.js (must be before our script) -->
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.js" defer></script>
</head>
<body>
  <div id="w">
    <h1>PDF Library <span id="count"></span></h1>
    <div class="searchwrap"><input id="q" type="search" placeholder="Search files…"></div>
    <div id="grid" class="grid"></div>
    <div id="status">Loading…</div>
  </div>

<script defer>
(() => {
  // ---------- small helpers ----------
  const S = t => document.getElementById("status").textContent = t || "";
  const $ = id => document.getElementById(id);

  // If your PDFs live in /pdfs relative to index.html, this is correct.
  const MANIFEST_URL = "./pdfs.json?v=" + Date.now();
  const MAKE_THUMBS  = true;   // set false if you want to disable previews
  const THUMB_SCALE  = 0.45;

  // Make sure the worker is set BEFORE we call getDocument
  window.addEventListener('DOMContentLoaded', () => {
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.js";
    }
  });

  let all = [], filtered = [];

  // load manifest then render
  (async function init(){
    try {
      const r = await fetch(MANIFEST_URL, {cache:"no-store"});
      if (!r.ok) throw new Error("Cannot load pdfs.json ("+r.status+").");
      all = (await r.json()).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
      filtered = all.slice();
      $("count").textContent = `(${all.length})`;
      render(filtered);
      S("Ready.");
    } catch (e) {
      console.error(e);
      S("Error: " + (e?.message || e));
    }
  })();

  // search
  $("q").addEventListener("input", e => {
    const q = e.target.value.trim().toLowerCase();
    filtered = q ? all.filter(x=>x.name.toLowerCase().includes(q)) : all.slice();
    render(filtered);
  });

    const grid = $("grid");
    grid.innerHTML = "";
    const io = MAKE_THUMBS ? new IntersectionObserver(onIntersect, {rootMargin:"200px"}) : null;

      const card = document.createElement("div");
      card.className = "card";

      const a = document.createElement("a");
      a.href = it.href;
      a.target = "_blank";
      a.rel = "noopener";

      const img = document.createElement("img");
      img.className = "thumb";
      img.alt = "Open PDF";
      img.loading = "lazy";
      a.appendChild(img);

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = it.name;
